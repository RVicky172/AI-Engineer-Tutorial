[project]
name = "kb-lab"
version = "0.1.0"
description = "M03 Lab 02: Bedrock Knowledge Bases on S3 Vectors, scripted up and down, same golden set"
requires-python = ">=3.12"
dependencies = ["ragkit", "boto3"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.uv.sources]
ragkit = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=kb_lab --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["src/kb_lab/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ragkit", "kb_lab"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25", "pgvector.*", "sentence_transformers"]
ignore_missing_imports = true
