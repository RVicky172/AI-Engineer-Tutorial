[project]
name = "rag-pipeline"
version = "0.1.0"
description = "M03 Lab 01: pgvector RAG, chunk-size experiment, hybrid search, cited answers"
requires-python = ">=3.12"
dependencies = ["ragkit", "llm-common"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.uv.sources]
ragkit = { path = "../common", editable = true }
llm-common = { path = "../../../M02-llm-fundamentals/labs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=rag_pipeline --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["src/rag_pipeline/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ragkit", "rag_pipeline"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25", "pgvector.*", "sentence_transformers"]
ignore_missing_imports = true
