[project]
name = "rerank"
version = "0.1.0"
description = "M03 Lab 04: cross-encoder and Bedrock reranking, measured before and after"
requires-python = ">=3.12"
dependencies = ["ragkit", "llm-common"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.uv.sources]
ragkit = { path = "../common", editable = true }
llm-common = { path = "../../../M02-llm-fundamentals/labs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rerank"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=rerank --cov-report=term-missing --cov-fail-under=90"
markers = ["model: downloads and runs the local cross-encoder (slow on first run)"]

[tool.coverage.run]
omit = ["src/rerank/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ragkit", "rerank"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25", "pgvector.*", "sentence_transformers"]
ignore_missing_imports = true
