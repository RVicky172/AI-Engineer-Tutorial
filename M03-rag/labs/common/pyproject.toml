[project]
name = "ragkit"
version = "0.1.0"
description = "M03 shared RAG pieces: corpus, chunking, embedders, pgvector store, BM25 + RRF, metrics, cited answers"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]",
  "pgvector",
  "numpy",
  "rank-bm25",
  "pypdf",
  "pyyaml",
  "pydantic>=2",
  "sentence-transformers",
  "boto3",
  "llm-common",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML", "boto3-stubs[bedrock-runtime]"]

[tool.uv.sources]
llm-common = { path = "../../../M02-llm-fundamentals/labs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=ragkit --cov-report=term-missing --cov-fail-under=90"
markers = ["model: downloads and runs the local embedding model (slow on first run)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25", "pgvector.*", "sentence_transformers"]
ignore_missing_imports = true
