[project]
name = "config-loader"
version = "0.1.0"
description = "M01 Lab 03: load app config from Secrets Manager + S3, tested with moto (no real AWS)"
requires-python = ">=3.12"
dependencies = ["boto3", "pydantic>=2"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "moto[s3,secretsmanager]",
    "boto3-stubs[s3,secretsmanager]",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_loader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=config_loader --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and obviously-fake test passwords

[tool.mypy]
strict = true
mypy_path = "src"
