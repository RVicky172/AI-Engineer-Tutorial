[project]
name = "resilient-http"
version = "0.1.0"
description = "M01 Lab 02: async HTTP client with timeouts, retries, backoff+jitter and a circuit breaker"
requires-python = ">=3.12"
dependencies = ["httpx", "structlog"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "respx", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_http"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=resilient_http --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/resilient_http/backoff.py" = ["S311"]  # jitter needs spread, not cryptographic randomness

[tool.mypy]
strict = true
mypy_path = "src"
