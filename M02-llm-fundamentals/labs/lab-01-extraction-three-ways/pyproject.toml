[project]
name = "extraction"
version = "0.1.0"
description = "M02 Lab 01: extract ticket fields three ways (plain prompt, few-shot, structured output) and measure them"
requires-python = ">=3.12"
dependencies = ["anthropic[bedrock]>=2.3", "pydantic>=2", "llm-common"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.uv.sources]
llm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=extraction --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["src/extraction/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"data/build_dataset.py" = ["E501"]  # one email per tuple reads better than wrapped strings

[tool.mypy]
strict = true
mypy_path = "src"
