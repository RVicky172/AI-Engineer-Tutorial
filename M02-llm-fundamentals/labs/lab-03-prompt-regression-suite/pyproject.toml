[project]
name = "regression"
version = "0.1.0"
description = "M02 Lab 03: versioned prompts and a pytest regression suite with flakiness detection"
requires-python = ">=3.12"
dependencies = ["anthropic[bedrock]>=2.3", "pydantic>=2", "pyyaml", "llm-common"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML"]

[tool.uv.sources]
llm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regression"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=regression --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["src/regression/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
